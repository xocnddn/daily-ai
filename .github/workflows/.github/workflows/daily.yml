name: DailyQuestion

on:
  schedule:
      - cron: '0 4 * * *'
        workflow_dispatch:

        jobs:
          send:
              runs-on: ubuntu-latest
                  steps:
                        - uses: actions/checkout@v4
                              - uses: actions/setup-python@v5
                                      with:
                                                python-version: '3.11'
                                                      - run: pip install requests
                                                            - name: Send
                                                                    run: python daily_question.py
                                                                            env:
                                                                                      DEEPSEEK_KEY: \${{ secrets.DEEPSEEK_KEY }}
                                                                                                QQ_AUTH: \${{ secrets.QQ_AUTH }}
                                                                                                
